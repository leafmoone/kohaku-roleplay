name: kohaku-roleplay
version: 0.6.0
description: >-
  Tavern character cards and session-scoped roleplay for KohakuTerrarium
  (https://github.com/Kohaku-Lab/KohakuTerrarium).
  Licensed under the KohakuTerrarium License v1.0.
python_dependencies:
  - 'regex>=2024.11.6'
  - 'quickjs-ng>=0.18,<0.19'
  - 'tree-sitter>=0.25,<0.26'
  - 'tree-sitter-javascript>=0.25,<0.26'
creatures:
  - name: rp_agent
plugins:
  - name: roleplay
    module: kt_roleplay.runtime
    class: RoleplayPlugin
ui:
  sdk: '>=1,<2'
  entry: ui/index.js
  styles: [ui/style.css]
  i18n: {en: ui/i18n/en.json, zh-CN: ui/i18n/zh-CN.json}
  handler: kt_roleplay.catalog:CardCatalog
  api: kt_roleplay.launch:router
  contributes:
    - {kind: settings, id: library, label: Roleplay Cards, owner: package, icon: i-carbon-user-avatar}
    - {kind: tab, id: studio, label: Roleplay Library, owner: package, icon: i-carbon-book}
    - {kind: tab, id: worldbooks, label: Worldbook Library, owner: package, icon: i-carbon-notebook}
    - {kind: tab, id: novel-reader, label: Novel Reader, owner: package, icon: i-carbon-book}
    - {kind: panel, id: roleplay, label: role, owner: 'plugin:roleplay', icon: i-carbon-user-avatar, dock: true}
    - {kind: panel, id: gameplay, label: Play, owner: 'plugin:roleplay', icon: i-carbon-play, dock: true}
    - {kind: message-renderer, id: choices, label: Roleplay Choices, owner: 'plugin:roleplay', renderer: kt_roleplay.choices}
