name: progress-clock
version: 1.0.0
description: A reusable, session-local progress clock for Roleplay taverns.
creatures:
  - {name: rp_tavern, roleplay_pack: true}
plugins:
  - {name: progress-clock, module: progress_clock, class: ProgressClock}
ui:
  sdk: '>=1,<2'
  entry: ui/index.js
  styles: [ui/style.css]
  i18n: {en: ui/i18n/en.json, zh-CN: ui/i18n/zh-CN.json}
  contributes:
    - {kind: panel, id: clock, label: Clock, owner: 'plugin:progress-clock', icon: i-carbon-time, dock: true}
